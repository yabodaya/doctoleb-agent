[project]
name = "doctoleb-agent"
version = "0.1.0"
description = "WhatsApp messaging + AI layer of Doctoleb"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    # Runtime, not dev: app/channels/whatsapp/client.py calls the Meta Cloud API
    # from the api image and the worker image. It was dev-only while the test
    # client was the only user.
    "httpx>=0.27",
    # The OpenAI SDK, for AI replies (VS-005). Imported by exactly one module,
    # app/integrations/openai/chat.py. The major-version ceiling is deliberate:
    # a new major is an upgrade to make on purpose, not one a re-lock should
    # pick up. It brings its own HTTP stack (httpx2, not the httpx above) - see
    # docs/plans/VS-005-plan.md, C8.
    "openai>=3.20,<4",
    "redis>=5.2",
    "arq>=0.26",
    "alembic>=1.14",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: needs a real PostgreSQL; skipped when TEST_DATABASE_URL is unreachable",
]
